name: Feature request
description: Suggest a capability or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Conversational replies
        - Memory
        - Coder mode and languages
        - UI and accessibility
        - Offline and PWA
        - Security and privacy
        - Documentation and tooling
        - Other
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: The proposal works without a backend or remote API.
          required: true
        - label: The proposal does not add analytics, telemetry, or third-party scripts.
          required: true
