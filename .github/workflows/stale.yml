name: Stale issues

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          # Discussions and roadmap items are decisions, not stale chores.
          exempt-issue-labels: "pinned,security,roadmap,good first issue"
          days-before-issue-stale: 30
          days-before-issue-close: 14
          stale-issue-label: "stale"
          stale-issue-message: >-
            This issue has had no activity for 30 days. It will close in 14 days unless someone
            comments or removes the `stale` label. If it still matters, a short "still relevant"
            note is enough.
          close-issue-message: >-
            Closing as stale. Reopen it any time if the problem comes back, and include the current
            version and your browser so it can be reproduced.
          days-before-pr-stale: -1
          days-before-pr-close: -1
