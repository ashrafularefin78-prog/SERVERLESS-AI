name: Release

# Keeps a "Version Packages" pull request open from pending changesets. Merging
# it bumps the version, updates CHANGELOG.md, and tags nothing automatically:
# this package is private, so there is no npm publish step.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Open or update the version pull request
    # Only on branch pushes: a tag is a finished version, not a new changeset.
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          # onnxruntime-node's postinstall downloads ~100 MB from a CDN that the app
          # never uses (the browser build ships onnxruntime-web). One timeout there
          # should not fail a job; retry once, then fail for real.
          npm ci || npm ci
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: npm run version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A pushed tag is a published version, so the release it points at should carry
  # the exact bytes and the bill of materials. `gh` is preinstalled on runners, so
  # this needs no third-party action.
  artifacts:
    name: Attach build artifacts to the release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          # onnxruntime-node's postinstall downloads ~100 MB from a CDN that the app
          # never uses (the browser build ships onnxruntime-web). One timeout there
          # should not fail a job; retry once, then fail for real.
          npm ci || npm ci
      - run: npm run build
      - run: npm run check:size
      - run: npm run sbom > sbom.cdx.json
      - name: Package the build
        run: |
          cd dist
          zip -qr ../localmind-${{ github.ref_name }}.zip .
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A tag can be pushed before its release exists (that is what happened for
          # v1.1.0, and `gh release upload` then fails with "release not found").
          # Creating it here is idempotent: the notes come from the matching file when
          # there is one, and the release is otherwise left as it is.
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            NOTES="docs/release-notes-${{ github.ref_name }}.md"
            if [ -f "$NOTES" ]; then
              gh release create "${{ github.ref_name }}" --notes-file "$NOTES" --title "LocalMind ${{ github.ref_name }}"
            else
              gh release create "${{ github.ref_name }}" --generate-notes
            fi
          fi
          gh release upload "${{ github.ref_name }}"             "localmind-${{ github.ref_name }}.zip" sbom.cdx.json --clobber
