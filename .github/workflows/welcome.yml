name: Welcome first-time contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@a1db7729b356323c7988c20ed6f0d33fe31297be # v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >-
            Thanks for opening your first issue. To make it actionable, include the LocalMind
            version, your browser and OS, and the steps that reproduce it. If it is a privacy or
            security report, please close this and follow SECURITY.md instead.
          pr-message: >-
            Thanks for your first pull request. CONTRIBUTING.md lists the checks CI runs
            (`npm run lint`, `format:check`, `test`, `build`), the Conventional Commits format the
            title and commits must follow, and when a changeset is expected.
            <!-- Mentioning the maintainer turns this greeting into the notification, so a
            first-time pull request is never left waiting on a silent inbox. -->
            @ashrafularefin78-prog will review it soon.
