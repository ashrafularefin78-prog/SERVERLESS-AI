name: Welcome first-time contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@2ec0f0fd78838633cd1c1342e4536d49ef72be54 # v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >-
            Thanks for opening your first issue. To make it actionable, include the LocalMind
            version, your browser and OS, and the steps that reproduce it. If it is a privacy or
            security report, please close this and follow SECURITY.md instead.
          pr-message: >-
            Thanks for your first pull request. CONTRIBUTING.md lists the checks CI runs
            (`npm run lint`, `format:check`, `test`, `build`), the Conventional Commits format the
            title and commits must follow, and when a changeset is expected. A maintainer will
            review it soon.
