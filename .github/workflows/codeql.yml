name: CodeQL

# Static analysis for JavaScript/TypeScript, including the DOM sinks that matter
# most here: every path from model or document text to the DOM.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v3
        with:
          languages: javascript-typescript
          queries: security-extended
      # The app needs no compile step for analysis; this keeps the job fast and
      # independent of the model catalogue download.
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v3
        with:
          category: "/language:javascript-typescript"
