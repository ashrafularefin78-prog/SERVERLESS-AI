name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Signed build provenance (SLSA) for the artifact that ships to Pages.
  attestations: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Attest the exact bytes that get deployed. `dist/` is a directory, so it
      # is archived first; consumers can verify the archive against the
      # published provenance with `gh attestation verify`.
      - name: Package the build for attestation
        run: |
          cd dist
          zip -qr ../dist.zip .
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist.zip
      - uses: actions/upload-artifact@v7
        with:
          name: dist-provenance
          path: dist.zip
          retention-days: 90
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
