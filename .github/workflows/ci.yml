name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck, lint, format, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          # onnxruntime-node's postinstall downloads ~100 MB from a CDN that the app
          # never uses (the browser build ships onnxruntime-web). One timeout there
          # should not fail a job; retry once, then fail for real.
          npm ci || npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:workflows
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run evals
      - run: npm run evals:model
      - run: npm run build
      - run: npm run check:size
      - run: npm run sbom > sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30

  preview:
    name: Preview build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          # onnxruntime-node's postinstall downloads ~100 MB from a CDN that the app
          # never uses (the browser build ships onnxruntime-web). One timeout there
          # should not fail a job; retry once, then fail for real.
          npm ci || npm ci
      - run: npm run build
      # Download the artifact and serve it with any static file server to review
      # a pull request exactly as it would ship.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-dist
          path: dist
          retention-days: 14

  osv:
    name: OSV dependency scan
    # The reusable workflow pinned `--output=`, which the scanner has deprecated:
    # the file was never written and the reporter failed every run. Calling the
    # composite action directly avoids flags we cannot control and needs no SARIF
    # upload, so Code Scanning can stay optional.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=./package-lock.json
            --config=./osv-scanner.toml

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: |
          # onnxruntime-node's postinstall downloads ~100 MB from a CDN that the app
          # never uses (the browser build ships onnxruntime-web). One timeout there
          # should not fail a job; retry once, then fail for real.
          npm ci || npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Against the production build, not the dev server: the CSP header, the
      # service worker, and the hashed asset names only exist after `vite build`,
      # and the dev server ships ~4.6 MB of unbundled modules instead of the
      # minified entry. Testing the dev server tested something users never run.
      - run: npm run test:e2e:preview
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
